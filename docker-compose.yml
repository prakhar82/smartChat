###############################################################################
# 🚀 SmartChat - Full Stack Deployment (Docker Compose)
# -----------------------------------------------------------------------------
# Services:
#  - PostgreSQL  (User + metadata storage)
#  - MongoDB     (Chat + attachments)
#  - Redis       (Cache + contact sync)
#  - RabbitMQ    (AMQP + STOMP for WebSocket relay)
#  - Spring Boot (SmartChat API)
#  - Angular/Ionic (Frontend via NGINX)
#
# Features:
#  ✅ Health checks for each service
#  ✅ Centralized .env configuration
#  ✅ Persistent named volumes
#  ✅ Logging mounts for debugging
#  ✅ Dependency-based startup (wait-for-health)
#  ✅ Resource limits for safety
###############################################################################

version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

services:

  # =========================
  # 🗄️ PostgreSQL
  # =========================
  postgres:
    image: postgres:16
    container_name: smartchat_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - ./logs/postgres:/var/log/postgresql
    command: >
      postgres -c logging_collector=on
               -c log_destination=stderr
               -c log_directory=/var/log/postgresql
               -c log_filename=postgres.log
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================
  # 🍃 MongoDB
  # =========================
  mongo:
    image: mongo:7
    container_name: smartchat_mongo
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d
      - ./logs/mongo:/var/log/mongodb
    command: >
      mongod --quiet
             --logpath /var/log/mongodb/mongod.log
             --logRotate rename
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet",
              "-u", "${MONGO_INITDB_ROOT_USERNAME}",
              "-p", "${MONGO_INITDB_ROOT_PASSWORD}",
              "--authenticationDatabase", "admin",
              "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================
  # ⚡ Redis
  # =========================
  redis:
    image: redis:7-alpine
    container_name: smartchat_redis
    restart: unless-stopped
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf", "--logfile", "" ]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
      - ./logs/redis:/var/log/redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  # =========================
  # 🕊️ RabbitMQ (AMQP + STOMP)
  # =========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: smartchat_rabbitmq
    restart: unless-stopped
    env_file: .env
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Admin Web UI
      - "61613:61613"  # STOMP relay
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./logs/rabbitmq:/var/log/rabbitmq
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp &&
             rabbitmq-plugins enable --offline rabbitmq_management &&
             rabbitmq-server"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================
  # 🧠 SmartChat API (Spring Boot)
  # =========================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartchat_api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      API_PORT: ${API_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}
      POSTGRES_HOST: postgres
      MONGO_HOST: mongo
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      STOMP_RELAY_PORT: 61613
    ports:
      - "${API_PORT}:${API_PORT}"
      - "5005:5005"
    command: >
      sh -c "java -jar app.jar --server.port=${API_PORT} >> /var/log/api/api.log 2>&1"
    volumes:
      - ./logs/api:/var/log/api
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${API_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G

  # =========================
  # 🌐 Frontend (Angular/Ionic)
  # =========================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartchat_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./logs/web:/var/log/nginx
    command: [ "nginx", "-g", "daemon off;" ]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

# =========================
# 💾 Named Volumes
# =========================
volumes:
  pgdata:
  mongodata:
  redisdata:
  rabbitmqdata:
