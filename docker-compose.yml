###############################################################################
# 🚀 SMARTCHAT - Full Stack Production Deployment (Stable Build)
# PostgreSQL + MongoDB + Redis + RabbitMQ + Eureka + Prometheus + Grafana + NGINX
# Persistent Volumes, HTTPS Gateway, Health Checks & Cross-Service DNS
###############################################################################

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

volumes:
  pgdata:
  mongodata:
  redisdata:
  rabbitmqdata:
  m2repo:

# ---------------------------------------------------------------------------
# 🌐 Universal Shared Network (fixes DNS resolution inside containers)
# ---------------------------------------------------------------------------
networks:
  smartchat-net:
    driver: bridge
    name: smartchat-net

services:
  ###########################################################################
  # 🗄️ PostgreSQL
  ###########################################################################
  postgres:
    image: postgres:16
    container_name: smartchat_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_AUTH} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 🍃 MongoDB
  ###########################################################################
  mongo:
    image: mongo:7
    container_name: smartchat_mongo
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME}", "-p", "${MONGO_INITDB_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # ⚡ Redis
  ###########################################################################
  redis:
    image: redis:7-alpine
    container_name: smartchat_redis
    restart: unless-stopped
    command: [ "redis-server" ]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 🐇 RabbitMQ — Message Bus + STOMP Relay Bridge
  ###########################################################################
  ###########################################################################
  # 🐇 RabbitMQ — Message Bus + STOMP Relay Bridge (Windows-Safe)
  ###########################################################################
  rabbitmq:
    build:
      context: ./infra/rabbitmq
      dockerfile: Dockerfile
    container_name: smartchat_rabbitmq
    restart: unless-stopped
    env_file: .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
      RABBITMQ_ERLANG_COOKIE: SMARTCHAT_COOKIE
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"          # AMQP (internal broker)
      - "15672:15672"                          # RabbitMQ Management UI
      # 🟢 DO NOT expose 61613 — it's used only inside Docker network
      - "${RABBITMQ_WEBSTOMP_PORT:-15674}:15674" # Web-STOMP (for browser SockJS)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    command: >
      sh -c "
        rabbitmq-plugins enable --offline rabbitmq_management rabbitmq_stomp rabbitmq_web_stomp &&
        rabbitmq-server
      "
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 🧭 Eureka Discovery
  ###########################################################################
  smartchat-discovery:
    container_name: smartchat-discovery
    hostname: smartchat-discovery
    build:
      context: .
      dockerfile: backend/base.Dockerfile
      args:
        MODULE_NAME: smartchat-discovery
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_INSTANCE_HOSTNAME: smartchat-discovery
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false
    ports:
      - "${EUREKA_PORT}:8761"
    volumes:
      - ./backend/smartchat-discovery/src/main/resources/application-prod.yml:/app/config/application-prod.yml:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8761/actuator/health || exit 1" ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 🔐 Auth Service
  ###########################################################################
  smartchat-auth:
    container_name: smartchat-auth
    hostname: smartchat-auth
    build:
      context: .
      dockerfile: backend/base.Dockerfile
      args:
        MODULE_NAME: smartchat-auth
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_DB: ${POSTGRES_DB_AUTH}
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://smartchat-discovery:8761/eureka/
    volumes:
      - ./backend/smartchat-auth/src/main/resources/application-prod.yml:/app/config/application-prod.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      smartchat-discovery:
        condition: service_healthy
    ports:
      - "${AUTH_PORT}:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 💬 Chat Service
  ###########################################################################
  smartchat-chat:
    container_name: smartchat-chat
    hostname: smartchat-chat
    build:
      context: .
      dockerfile: backend/base.Dockerfile
      args:
        MODULE_NAME: smartchat-chat
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      RABBITMQ_HOST: rabbitmq
      STOMP_RELAY_PORT: 61613
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_URL: http://smartchat-discovery:8761/eureka/
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      smartchat-discovery:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 📇 Contact Service
  ###########################################################################
  smartchat-contact:
    container_name: smartchat-contact
    hostname: smartchat-contact
    build:
      context: .
      dockerfile: backend/base.Dockerfile
      args:
        MODULE_NAME: smartchat-contact
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_DB: ${POSTGRES_DB_CONTACT}
      EUREKA_URL: http://smartchat-discovery:8761/eureka/
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      smartchat-discovery:
        condition: service_healthy
    ports:
      - "${CONTACT_PORT}:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 🚪 API Gateway (HTTPS + Eureka Routing)
  ###########################################################################
  smartchat-api:
    container_name: smartchat-api
    hostname: smartchat-api
    build:
      context: .
      dockerfile: backend/base.Dockerfile
      args:
        MODULE_NAME: smartchat-api
        MODULE_PORT: 8443
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://smartchat-discovery:8761/eureka/
    depends_on:
      smartchat-auth:
        condition: service_healthy
      smartchat-chat:
        condition: service_healthy
      smartchat-contact:
        condition: service_healthy
      smartchat-discovery:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      - ./backend/smartchat-api/src/main/resources/application.yml:/app/config/application.yml:ro
      - ./backend/smartchat-api/src/main/resources/application-prod.yml:/app/config/application-prod.yml:ro
      - ./infra/certs/smartchat.p12:/app/keystore/smartchat.p12:ro
    healthcheck:
      test: [ "CMD", "curl", "-kfs", "https://localhost:8443/actuator/health" ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 🌐 Frontend (NGINX + Angular + HTTPS)
  ###########################################################################
  smartchat-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartchat-web
    hostname: smartchat-web
    restart: on-failure
    depends_on:
      smartchat-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/certs/localhost+2.pem:/etc/ssl/certs/localhost+2.pem:ro
      - ./infra/certs/localhost+2-key.pem:/etc/ssl/certs/localhost+2-key.pem:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/nginx-health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - smartchat-net
    logging: *default-logging

  ###########################################################################
  # 📊 Monitoring (Prometheus + Grafana)
  ###########################################################################
  prometheus:
    image: prom/prometheus:latest
    container_name: smartchat_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - smartchat-net
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: smartchat_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - smartchat-net
    logging: *default-logging
