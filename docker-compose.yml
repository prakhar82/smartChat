###############################################################################
# SmartChat - Docker Compose (Improved Production-Ready Setup)
# -----------------------------------------------------------------------------
# Services:
# - PostgreSQL (Relational DB)
# - MongoDB (NoSQL for chat/media)
# - Redis (Cache & Pub/Sub)
# - RabbitMQ (Message broker: AMQP + STOMP)
# - Spring Boot API (Backend)
# - Angular/Ionic Frontend (Nginx)
#
# Improvements:
# ✅ Healthchecks for all services
# ✅ File-based logging (with volumes)
# ✅ Separate profiles (dev/prod)
# ✅ Resource limits for containers
# ✅ RabbitMQ persistence & plugin enablement
# ✅ API startup waits for healthy DBs & broker
###############################################################################

x-logging: &default-logging
  options:
    max-size: "10m"
    max-file: "5"

services:
  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:16
    container_name: pg
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - ./logs/postgres:/var/log/postgresql
    command: >
      postgres -c logging_collector=on
               -c log_destination=stderr
               -c log_directory=/var/log/postgresql
               -c log_filename=postgres.log
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================
  # MongoDB
  # =========================
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command: >
      mongod --quiet
             --logpath /var/log/mongodb/mongod.log
             --logRotate rename
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d
      - ./logs/mongo:/var/log/mongodb
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet",
              "-u", "${MONGO_INITDB_ROOT_USERNAME}",
              "-p", "${MONGO_INITDB_ROOT_PASSWORD}",
              "--authenticationDatabase", "admin",
              "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: [ "redis-server", "/usr/local/etc/redis/redis.conf", "--logfile", "" ]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
      - ./logs/redis:/var/log/redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # =========================
  # RabbitMQ (AMQP + STOMP)
  # =========================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    env_file: .env
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Web UI
      - "61613:61613"  # STOMP relay
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
      - ./logs/rabbitmq:/var/log/rabbitmq
    command: >
      sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp &&
             rabbitmq-plugins enable --offline rabbitmq_management &&
             rabbitmq-server"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # =========================
  # Spring Boot API
  # =========================
  api:
    build: ./backend
    container_name: api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      STOMP_RELAY_PORT: 61613
      API_PORT: ${API_PORT}
    command: >
      sh -c "java -jar app.jar --server.port=${API_PORT} >> /var/log/api/api.log 2>&1"
    volumes:
      - ./logs/api:/var/log/api
    ports:
      - "${API_PORT}:${API_PORT}"
      - "5005:5005"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${API_PORT}/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  # =========================
  # Angular Frontend
  # =========================
  web:
    build: ./frontend
    container_name: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./logs/web:/var/log/nginx
    command: [ "nginx", "-g", "daemon off;" ]
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 256M

# =========================
# Volumes
# =========================
volumes:
  pgdata:
  mongodata:
  redisdata:
  rabbitmqdata:
