###############################################################################
# SmartChat - Docker Compose Stack
# -----------------------------------------------------------------------------
# Services included:
# - PostgreSQL (Relational DB)
# - MongoDB (NoSQL DB for chat messages/media)
# - Redis (In-memory cache & Pub/Sub for realtime chat)
# - Spring Boot API (backend business logic, REST APIs)
# - Angular/Ionic Frontend (user-facing client)
#
# Why Docker Compose?
# - Spins up full dev stack with a single command (`docker compose up`).
# - Provides clean isolation (each service in its own container).
# - Volumes ensure persistence of DB/cache across restarts.
#
# Copyright (c) 2025 SmartChat Contributors
###############################################################################

services:
  # =========================
  # PostgreSQL Database
  # =========================
  postgres:
    image: postgres:16
    container_name: pg
    restart: unless-stopped
    env_file: .env                       # Load environment vars (DB name, user, pass, port)
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"          # Host → Container
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # MongoDB
  # =========================
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Redis
  # =========================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server","/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Spring Boot API (Backend)
  # =========================
  api:
    build: ./backend
    container_name: api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENABLE_DEBUG: ${ENABLE_DEBUG}      # Toggle JVM debug mode
      DEBUG_PORT: ${DEBUG_PORT}          # JVM Debugging port
      DEBUG_SUSPEND: ${DEBUG_SUSPEND}    # y = wait for debugger
      API_PORT: ${API_PORT}              # REST API Port
    ports:
      - "${API_PORT}:${API_PORT}"        # Dynamic API port mapping
      - "${DEBUG_PORT}:${DEBUG_PORT}"    # Debugger (5005 by default)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================
  # Angular/Ionic Frontend
  # =========================
  web:
    build: ./frontend
    container_name: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

# =========================
# Volumes (Persistence)
# =========================
volumes:
  pgdata:
  mongodata:
  redisdata:
  marklogicdata:
