###############################################################################
# SmartChat - Docker Compose Stack
# -----------------------------------------------------------------------------
# Services included:
# - PostgreSQL (Relational DB)
# - MongoDB (NoSQL DB for chat messages/media)
# - Redis (In-memory cache & Pub/Sub for realtime chat)
# - Spring Boot API (backend business logic, REST APIs)
# - Angular/Ionic Frontend (user-facing client)
#
# Why Docker Compose?
# - Spins up full dev stack with a single command (`docker compose up`).
# - Provides clean isolation (each service in its own container).
# - Volumes ensure persistence of DB/cache across restarts.
# - Dedicated log files per service keep console logs clean.
#
# Copyright (c) 2025 SmartChat Contributors
###############################################################################

services:
  # =========================
  # PostgreSQL Database
  # -------------------------
  # WHAT: Relational DB for structured app data
  # WHY: ACID compliance, relational queries
  # WHERE: Backend connects via JDBC
  # LOGS: Written to ./logs/postgres/postgres.log
  # =========================
  postgres:
    image: postgres:16
    container_name: pg
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
      - ./logs/postgres:/var/log/postgresql
    command: ["postgres", "-c", "logging_collector=on", "-c", "log_destination=stderr", "-c", "log_directory=/var/log/postgresql", "-c", "log_filename=postgres.log"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # MongoDB
  # -------------------------
  # WHAT: NoSQL DB for chat messages/media
  # WHY: Flexible schema for dynamic chat content
  # WHERE: Backend via Spring Data MongoDB
  # LOGS: Written to ./logs/mongo/mongod.log
  # =========================
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    command: ["mongod", "--quiet", "--logpath", "/var/log/mongodb/mongod.log", "--logRotate", "rename"]
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d
      - ./logs/mongo:/var/log/mongodb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Redis
  # -------------------------
  # WHAT: In-memory cache & Pub/Sub
  # WHY: Realtime chat updates + caching
  # WHERE: Used by backend API
  # LOGS: Written to ./logs/redis/redis.log
  # =========================
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--logfile", "/var/log/redis/redis.log"]
    volumes:
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redisdata:/data
      - ./logs/redis:/var/log/redis
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Spring Boot API (Backend)
  # -------------------------
  # WHAT: Business logic + REST APIs
  # WHY: Connects DBs + Redis, runs app core
  # WHERE: Exposed to frontend client
  # LOGS: Written to ./logs/api/api.log
  # =========================
  api:
    build: ./backend
    container_name: api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${PROFILE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENABLE_DEBUG: ${ENABLE_DEBUG}
      DEBUG_PORT: ${DEBUG_PORT}
      DEBUG_SUSPEND: ${DEBUG_SUSPEND}
      API_PORT: ${API_PORT}
    command: [ "sh", "-c", "java -jar app.jar --server.port=${API_PORT} >> /var/log/api/api.log 2>&1" ]
    volumes:
      - ./logs/api:/var/log/api
    ports:
      - "${API_PORT}:${API_PORT}"
      - "${DEBUG_PORT}:${DEBUG_PORT}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================
  # Angular/Ionic Frontend
  # -------------------------
  # WHAT: User-facing chat UI
  # WHY: Provides app interface
  # WHERE: Calls backend API
  # LOGS: Written to ./logs/web/nginx.log
  # =========================
  web:
    build: ./frontend
    container_name: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./logs/web:/var/log/nginx
    command: [ "sh", "-c", "nginx -g 'daemon off;' >> /var/log/nginx/nginx.log 2>&1" ]
    ports:
      - "80:80"

# =========================
# Volumes (Persistence)
# -------------------------
# WHAT: Persists DB/cache data
# WHY: Survive restarts, avoid data loss
# WHERE: Bound to PG, Mongo, Redis
# =========================
volumes:
  pgdata:
  mongodata:
  redisdata:
  marklogicdata:
