# ============================================================
# RabbitMQ Configuration (3.13+ Compatible)
# ============================================================

# Management UI
management.listener.port = 15672
management.listener.ssl  = false

# AMQP (core)
listeners.tcp.1 = 5672

# STOMP (used by backend microservices)
stomp.listeners.tcp.1 = 61613
stomp.default_vhost   = smartchat
stomp.default_user    = smartchat_user
stomp.default_pass    = smartchat123

# Web STOMP (for browser clients)
web_stomp.tcp.port = 15674
web_stomp.tcp.ip   = 0.0.0.0
# ⚠️ Do not set web_stomp.default_* here; not supported in 3.13+
# Authentication handled via existing users & vhosts.

# System thresholds
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Prometheus metrics
prometheus.return_per_object_metrics = true
prometheus.tcp.port = 15692
