<div *ngFor="let msg of messages" [class.self]="msg.senderId === userId">
  <span>{{ msg.message }}</span>
  <small>
    <ng-container [ngSwitch]="msg.status">
      <span *ngSwitchCase="'SENT'">✓</span>
      <span *ngSwitchCase="'DELIVERED'">✓✓</span>
      <span *ngSwitchCase="'READ'">✓✓✔</span>
    </ng-container>
  </small>
</div>
