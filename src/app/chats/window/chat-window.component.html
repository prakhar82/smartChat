<div>
  <h2>Chat with {{ contactId }}</h2>

  <div class="messages">
    <div *ngFor="let m of messages">
      <div><strong>{{ m.senderId }}</strong>: {{ m.message }}</div>
      <div><small>{{ m.timestamp }}</small></div>
      <hr />
    </div>
  </div>

  <div>
    <input [(ngModel)]="newMessage" (keyup.enter)="send()" placeholder="Type a message..." />
    <button (click)="send()">Send</button>
  </div>
</div>
