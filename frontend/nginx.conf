###############################################################################
# 🌐 SmartChat — Final NGINX for production domain: app.smartchat.ai
###############################################################################

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

resolver 127.0.0.11 ipv6=off;

server {
    listen 443 ssl;
    http2 on;
    server_name app.smartchat.ai www.app.smartchat.ai;
   # 🔐 Your SSL certs (replace with real certs if using Let's Encrypt)
    ssl_certificate     /etc/ssl/certs/localhost+2.pem;
    ssl_certificate_key /etc/ssl/certs/localhost+2-key.pem;

    ###########################################################################
    # 📦 Frontend Angular SPA
    ###########################################################################
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    ###########################################################################
    # 🚏 API — EVERYTHING goes to API Gateway
    ###########################################################################
    location /api/ {
        proxy_pass https://smartchat-api:8443;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    ###########################################################################
    # 🔌 WebSockets (Chat)
    ###########################################################################
    location ~ ^/ws-chat(/.*)?$ {
        proxy_pass http://smartchat-chat:8080/ws-chat$1$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Authorization $http_authorization;
    }
}

###########################################################################
# 🌍 Redirect HTTP → HTTPS
###########################################################################
server {
    listen 80;
    server_name app.smartchat.ai;
    return 301 https://$host$request_uri;
}
