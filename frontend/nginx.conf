###############################################################################
# 🌐 SmartChat Nginx Configuration (Final Production Version - Fixed)
###############################################################################

server {
  listen 80;
  server_name localhost;

  # =============================
  # 📦 Frontend (Angular build)
  # =============================
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing support
  location / {
    try_files $uri $uri/ /index.html;
  }

  # =============================
  # ⚙️ API Reverse Proxy
  # =============================
  location /api/ {
      # ✅ Handle CORS preflight
      if ($request_method = OPTIONS) {
          add_header 'Access-Control-Allow-Origin' "$http_origin" always;
          add_header 'Access-Control-Allow-Credentials' 'true' always;
          add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
          add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Requested-With' always;
          add_header 'Access-Control-Max-Age' 3600 always;
          return 204;
      }

      # ✅ Reverse proxy to backend
      proxy_pass http://api:8080/api/;
      proxy_http_version 1.1;

      # ✅ Ensure JWT and headers are properly forwarded
      proxy_set_header Authorization $http_authorization;
      proxy_pass_request_headers on;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $http_origin;

      # ✅ CORS headers
      add_header Access-Control-Allow-Origin "$http_origin" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
  }

  # =============================
  # 💬 WebSocket Proxy (STOMP)
  # =============================
  location /ws-chat/ {
    proxy_pass http://api:8080/ws-chat/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Credentials "true" always;
  }

  # =============================
  # 📁 Static Asset Optimization
  # =============================
  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webp)$ {
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # =============================
  # 🧠 Security Headers
  # =============================
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ✅ FIXED: Allow popup OAuth window to close without COOP blocking
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "cross-origin" always;
  add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

  # =============================
  # ⚡ Gzip Compression
  # =============================
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 256;
  gzip_comp_level 5;

  # =============================
  # ❤️ Healthcheck
  # =============================
  location /health {
    return 200 "OK";
    add_header Content-Type text/plain;
  }

  # =============================
  # 🏠 Index fallback
  # =============================
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /home {
    try_files /index.html =404;
  }
}
