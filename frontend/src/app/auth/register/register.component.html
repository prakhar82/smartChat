<!-- src/app/auth/register/register.component.html -->
<div class="register-container">
  <h2>Create your SmartChat account</h2>

  <form #f="ngForm" (ngSubmit)="register(f)">
    <input [(ngModel)]="user.firstName" name="firstName" placeholder="First Name" required />
    <input [(ngModel)]="user.lastName" name="lastName" placeholder="Last Name" required />

    <div class="mobile-inputs">
      <input [(ngModel)]="user.countryCode" name="countryCode" placeholder="+91" required />
      <input [(ngModel)]="user.mobileNumber" name="mobileNumber" placeholder="Mobile Number" required />
    </div>

    <input [(ngModel)]="user.email" name="email" placeholder="Email" required />
    <input type="password" [(ngModel)]="user.password" name="password" placeholder="Password" required />
    <input type="password" [(ngModel)]="user.confirmPassword" name="confirmPassword" placeholder="Confirm Password" required />

    <button type="submit" [disabled]="isLoading">
      <ng-container *ngIf="!isLoading">Register</ng-container>
      <ng-container *ngIf="isLoading"><span class="spinner"></span> {{ loadingMessage }}</ng-container>
    </button>
  </form>

  <p>Already have an account? <a routerLink="/login">Login</a></p>
</div>
