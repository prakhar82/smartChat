<div class="auth-page">
  <div class="auth-card">
    <h1 class="app-title">Create Account ✨</h1>
    <p class="subtitle">Join <strong>SmartChat</strong> and connect smarter</p>

    <form (ngSubmit)="onRegister()" class="auth-form">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input id="firstName" name="firstName" [(ngModel)]="firstName" placeholder="John" required/>
        </div>

        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" name="lastName" [(ngModel)]="lastName" placeholder="Doe" required/>
        </div>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <div class="input-prefix">
          <span>+91</span>
          <input id="mobile" name="mobile" [(ngModel)]="mobile" type="tel" placeholder="9876543210" required/>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email (optional)</label>
        <input id="email" name="email" [(ngModel)]="email" type="email" placeholder="you@example.com"/>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" [(ngModel)]="password" type="password" required/>
        </div>

        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input id="confirm" name="confirm" [(ngModel)]="confirm" type="password" required/>
        </div>
      </div>

      <button class="btn-primary" type="submit">Register</button>

      <p class="footer-text">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>
    </form>
  </div>
</div>
