<!-- =========================================================
     🧭 SmartChat Left Sidebar
     - Displays user info, navigation, and quick controls.
     ========================================================= -->
<nav class="left-sidebar" aria-label="SmartChat sidebar">

  <!-- =========================================================
       👤 Profile Section
       ========================================================= -->
  <!-- 👤 Profile Section -->
  <div class="profile-section">
    <div class="profile-avatar" aria-hidden="true">
      {{ firstName[0] || 'U' }}
    </div>

    <div class="profile-name">
      {{ firstName }}
    </div>

    <select
      class="status-dropdown"
      [(ngModel)]="userStatus"
      (change)="changeStatus(userStatus)"
      aria-label="Set your status"
    >
      <option value="available">🟢 Available</option>
      <option value="busy">🔴 Busy</option>
      <option value="away">🟡 Away</option>
    </select>
  </div>


  <!-- =========================================================
       📂 Top Section (Main Navigation)
       ========================================================= -->
  <div class="icons-top">
    <button
      class="icon-btn"
      title="Profile"
      (click)="goToChats()"
      aria-label="Profile"
    >
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.418 0-8 2.691-8 6v2h16v-2c0-3.309-3.582-6-8-6z"
        />
      </svg>
    </button>

    <button
      class="icon-btn"
      title="Chats"
      (click)="goToChats()"
      aria-label="Chats"
    >
      <svg viewBox="0 0 24 24" width="22" height="22">
        <path
          d="M21 6.5A2.5 2.5 0 0 0 18.5 4H5.5A2.5 2.5 0 0 0 3 6.5v7A2.5 2.5 0 0 0 5.5 16H7v3l3.5-3H18.5A2.5 2.5 0 0 0 21 13.5v-7z"
        />
      </svg>
    </button>
  </div>

  <!-- =========================================================
       ⚙️ Bottom Section (Actions)
       ========================================================= -->
  <div class="icons-bottom">
    <!-- 🔄 Google Contacts Sync -->
    <button
      class="icon-btn"
      [disabled]="isSyncing"
      (click)="requestGoogleSync()"
      title="Sync Google Contacts"
      aria-label="Sync"
    >
      <ng-container *ngIf="!isSyncing; else syncLoading">
        <img
          src="assets/google-icon.png"
          width="20"
          height="20"
          alt="Google"
          draggable="false"
        />
      </ng-container>
      <ng-template #syncLoading>
        <div class="spinner" role="status" aria-label="Syncing contacts..."></div>
      </ng-template>
    </button>

    <!-- 🌗 Theme Toggle -->
    <button
      class="icon-btn"
      title="Toggle Theme"
      (click)="onToggleTheme()"
      [attr.aria-pressed]="theme === 'dark'"
    >
      <!-- ☀️ Light Mode Icon -->
      <svg *ngIf="theme === 'light'" viewBox="0 0 24 24" width="18" height="18">
        <path
          d="M6.76 4.84l-1.8-1.79L3.17 4.83l1.79 1.8 1.8-1.79zM1 13h3v-2H1v2zm10 8h2v-3h-2v3zm7.03-3.8l1.8 1.79 1.79-1.79-1.8-1.8-1.79 1.8zM17 1h-2v3h2V1zM4.22 19.78l1.79-1.79-1.79-1.8L2.43 18l1.79 1.78zM12 6a6 6 0 100 12 6 6 0 000-12z"
        />
      </svg>

      <!-- 🌙 Dark Mode Icon -->
      <svg *ngIf="theme === 'dark'" viewBox="0 0 24 24" width="18" height="18">
        <path d="M20.742 13.045A8.002 8.002 0 0110.955 3.258a8 8 0 109.787 9.787z"/>
      </svg>
    </button>
  </div>

  <!-- =========================================================
       🔔 Toast Notification (Temporary Message)
       ========================================================= -->
  <div
    class="toast"
    *ngIf="showToast"
    [ngClass]="{
      success: toastType === 'success',
      error: toastType === 'error',
      info: toastType === 'info'
    }"
    role="alert"
  >
    {{ toastMessage }}
  </div>
</nav>
