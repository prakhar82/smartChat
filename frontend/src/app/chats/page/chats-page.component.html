<!-- =========================================================
     💬 SmartChat Main Workspace Layout
     - Left Sidebar
     - Contact Panel (with Header + Search + List)
     - Chat Panel (active conversation)
========================================================= -->

<div class="workspace" [class.dark]="isDarkTheme">
  <!-- =========================
       📂 LEFT SIDEBAR
  ========================== -->
  <div class="sidebar">
    <app-left-sidebar></app-left-sidebar>
  </div>

  <!-- =========================
       👥 CONTACTS PANEL
  ========================== -->
  <div class="contacts-panel">
    <!-- 🧭 Top Header (limited to contact panel) -->
    <app-top-header
      class="contacts-header"
      [firstName]="firstName"
      [isConnected]="isConnected"
      [isDarkTheme]="isDarkTheme"
      [userStatus]="userStatus"
      (toggleTheme)="toggleTheme()"
    ></app-top-header>

    <!-- 🔍 Search Bar -->
    <div class="search-bar">
      <input
        type="text"
        [(ngModel)]="searchQuery"
        (input)="filterContacts()"
        placeholder="Search by name or number..."
      />
    </div>

    <!-- 📇 Contact List -->
    <app-contact-list
      [contacts]="filteredContacts"
      (contactSelected)="openChat($event)"
    ></app-contact-list>
  </div>

  <!-- =========================
       💬 CHAT PANEL
  ========================== -->
  <div class="chat-panel">
    <!-- Active Chat Window -->
    <ng-container *ngIf="selectedContactId; else welcomeScreen">
      <app-chat-window
        [contactId]="selectedContactId"
        (closeChat)="closeChat()"
      ></app-chat-window>
    </ng-container>

    <!-- Empty State -->
    <ng-template #welcomeScreen>
      <div class="welcome">
        <h2>Welcome to SmartChat 👋</h2>
        <p>Select a contact to start chatting.</p>
      </div>
    </ng-template>
  </div>
</div>

<!-- =========================
     📱 MOBILE BOTTOM NAVBAR
     (visible only in mobile view)
========================= -->
<div class="bottom-nav" *ngIf="isMobileView">
  <button (click)="reconnect()">Reconnect</button>
  <button (click)="toggleTheme()">Toggle Theme</button>
</div>
