<div class="contact-list">
  <!-- 🔍 Search -->
  <div class="search-bar">
    <input
      type="text"
      placeholder="Search contacts"
      [(ngModel)]="searchQuery"
      (input)="onSearch()"
    />
  </div>

  <!-- 📋 Contacts -->
  <div class="contact-items">
    <div
      class="contact-item"
      *ngFor="let c of filtered; trackBy: trackById"
      (click)="openChat(c)"
    >
      <div class="avatar">
        <span>{{ c.contactName.charAt(0).toUpperCase() }}</span>
      </div>
      <div class="contact-info">
        <div class="contact-name">{{ c.contactName }}</div>

        <!-- Registered -->
        <div *ngIf="c.registered" class="meta registered">
          ✅ Registered
        </div>

        <!-- Invite -->
        <a
          *ngIf="c.canInvite && !c.registered"
          href="javascript:void(0)"
          class="meta invite-link"
          (click)="$event.stopPropagation(); openChat(c)"
        >➕ Invite</a
        >

        <!-- Last message -->
        <div class="last-message" *ngIf="c.lastMessage">
          {{ c.lastMessage }}
        </div>
      </div>

      <!-- Status dot -->
      <div
        class="status-dot"
        [ngClass]="{ online: c.online, offline: !c.online }"
      ></div>
    </div>
  </div>
</div>
