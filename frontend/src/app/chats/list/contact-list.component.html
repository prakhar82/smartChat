<!-- =========================================================
     📇 SmartChat Contact List
     ========================================================= -->
<div class="contact-list" role="list">
  <!-- 🌀 Loading Spinner -->
  <div class="loading" *ngIf="isLoading">
    <div class="spinner" role="status" aria-label="Loading contacts..."></div>
    <p>Loading contacts...</p>
  </div>

  <!-- ✅ Contacts -->
  <ng-container *ngIf="!isLoading && (contacts?.length || 0) > 0; else noContacts">
    <div
      class="contact-item"
      *ngFor="let contact of contacts; trackBy: trackById"
      (click)="onSelect(contact)"
      tabindex="0"
      role="button"
      aria-label="Select contact"
    >
      <!-- 🧑 Avatar -->
      <div class="avatar">
        <img
          *ngIf="contact.avatarUrl"
          [src]="contact.avatarUrl"
          [alt]="contact.contactName || 'User Avatar'"
          width="48"
          height="48"
        />
        <div *ngIf="!contact.avatarUrl" class="default-avatar">
          {{ contact.contactName ? contact.contactName[0] : '?' }}
        </div>
      </div>

      <!-- 💬 Contact Info -->
      <div class="contact-info">
        <div class="top">
          <span class="name">{{ contact.contactName || 'Unknown Contact' }}</span>
        </div>

        <div class="bottom">
          <!-- 💭 Last message -->
          <span class="last-message" *ngIf="contact.lastMessage; else noMsg">
            {{ contact.lastMessage }}
          </span>
          <ng-template #noMsg>
            <span class="last-message muted">No recent messages</span>
          </ng-template>

          <!-- 🟢 Online Status -->
          <span class="status" *ngIf="contact.registered">
            <app-presence-indicator
              [userId]="contact.matchedUserId ?? contact.contactId"
            ></app-presence-indicator>
            {{ contact.online ? 'Online' : 'Offline' }}
          </span>

          <!-- ✉️ Invite Button -->
          <button
            *ngIf="!contact.registered && contact.canInvite"
            class="invite-btn"
            (click)="invite(contact, $event)"
          >
            Invite
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- 🚫 Empty State -->
  <ng-template #noContacts>
    <div class="no-contacts" *ngIf="!isLoading">
      <p>📭 No contacts found. Try syncing Google contacts or adding new ones.</p>
    </div>
  </ng-template>
</div>
