<div class="chat-list-container">
  <input
    type="text"
    [(ngModel)]="searchQuery"
    (input)="filterContacts()"
    placeholder="🔍 Search contacts..."
  />

  <div *ngIf="loading">⏳ Loading contacts...</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <!-- Recent Chats -->
  <h3 *ngIf="recentChats.length">Recent Chats</h3>
  <ul>
    <li *ngFor="let c of recentChats" (click)="openChat(c)">
      <span>{{ c.contactName ? c.contactName : c.phoneNormalized }}</span>
      <button (click)="openChat(c); $event.stopPropagation()">💬 Continue</button>
    </li>
  </ul>

  <!-- Registered Contacts -->
  <h3 *ngIf="registeredContacts.length">Chats on SmartChat</h3>
  <ul>
    <li *ngFor="let c of registeredContacts" (click)="openChat(c)">
      <span>{{ c.contactName ? c.contactName : c.phoneNormalized }}</span>
      <button (click)="openChat(c); $event.stopPropagation()">💬 Chat</button>
    </li>
  </ul>

  <!-- Divider -->
  <hr *ngIf="registeredContacts.length && unregisteredContacts.length"/>

  <!-- Unregistered Contacts -->
  <h3 *ngIf="unregisteredContacts.length">Invite to SmartChat</h3>
  <ul>
    <li *ngFor="let c of unregisteredContacts">
      <span>{{ c.contactName ? c.contactName : c.phoneNormalized }}</span>
      <button (click)="sendInvite(c); $event.stopPropagation()">✉️ Invite</button>
    </li>
  </ul>
</div>
