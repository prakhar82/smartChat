<div class="chat-window">
  <div class="messages" #messagesContainer>
    <div *ngFor="let m of messages" [ngClass]="{'mine': m.senderId === 1, 'theirs': m.senderId !== 1}" class="msg">
      {{ m.text }}
    </div>
  </div>

  <div class="chat-input">
    <textarea
      [(ngModel)]="newMessage"
      (input)="checkOverflow($event)"
      placeholder="Type a message..."
    ></textarea>
    <button (click)="sendMessage()">Send</button>

    <div
      class="typing-tooltip"
      [class.visible]="showTypingTooltip"
      [title]="newMessage"
    >
      {{ truncatedMessage }}
    </div>
  </div>
</div>
