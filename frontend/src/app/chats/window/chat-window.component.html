<div class="chat-window">
  <div class="chat-header">
    <button class="back-btn" (click)="goBack()" *ngIf="isMobile">←</button>
    <div class="chat-title">Chat with {{ otherUserId }}</div>
  </div>

  <div class="chat-messages" #messagesContainer>
    <div
      *ngFor="let msg of messages; trackBy: trackByIdx"
      class="message"
      [class.mine]="msg.senderId === myUserId"
    >
      <div class="message-text">{{ msg.message }}</div>
      <div class="message-time">{{ msg.timestamp | date: 'shortTime' }}</div>
    </div>
  </div>

  <div class="chat-input">
    <textarea
      [(ngModel)]="newMessage"
      (input)="onInput($event)"
      placeholder="Type a message"
    ></textarea>
    <button (click)="sendMessage()">Send</button>
  </div>
</div>
