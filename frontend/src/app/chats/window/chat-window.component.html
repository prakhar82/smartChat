<!-- =========================================================
     💬 CHAT WINDOW
     Displays chat header, messages, and input area.
========================================================= -->
<div class="chat-container">
  <!-- =========================
       🧭 CHAT HEADER
  ========================== -->
  <div class="chat-header">
    <!-- ⬅️ Back Button (Mobile Only) -->
    <button
      class="back-btn"
      *ngIf="isMobileView"
      (click)="onBackClick()"
      aria-label="Go back"
    >
      ←
    </button>

    <!-- 👤 Contact Name -->
    <div class="contact-info">
      <h3 class="contact-name">
        {{ contactInfo?.contactName || 'Chat User' }}
      </h3>
      <p class="status">
        {{ contactInfo?.online ? 'Online' : 'Offline' }}
        <span
          class="dot"
          [class.online]="contactInfo?.online"
          [class.offline]="!contactInfo?.online"
        ></span>
      </p>
    </div>

    <!-- ❌ Close Chat (Desktop) -->
    <button
      class="close-btn"
      *ngIf="!isMobileView"
      (click)="onCloseChat()"
      aria-label="Close chat"
    >
      ✕
    </button>
  </div>

  <!-- =========================
       💬 MESSAGES AREA
  ========================== -->
  <div class="chat-body" #messageContainer>
    <div
      class="message"
      *ngFor="let msg of messages; trackBy: trackByMsgId"
      [ngClass]="{ 'from-me': msg.senderId === currentUserId, 'from-them': msg.senderId !== currentUserId }"
    >
      <div class="bubble">
        <span class="text">{{ msg.message }}</span>
        <span class="timestamp">{{ msg.timestamp | date: 'shortTime' }}</span>
      </div>
    </div>

    <!-- ✏️ Typing Indicator -->
    <div class="typing-indicator" *ngIf="isOtherTyping">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- =========================
       📝 INPUT BAR
  ========================== -->
  <div class="chat-input">
    <input
      type="text"
      placeholder="Type a message..."
      [(ngModel)]="newMessage"
      (input)="notifyTyping()"
      (keydown.enter)="sendMessage()"
      aria-label="Type message"
    />
    <button
      class="send-btn"
      (click)="sendMessage()"
      [disabled]="!newMessage.trim()"
      aria-label="Send message"
    >
      ➤
    </button>
  </div>
</div>
