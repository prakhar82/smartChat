<header class="top-header">
  <div class="brand">
    <img src="assets/logo.png" alt="SmartChat Logo" class="logo"/>
    <span class="app-name">SmartChat</span>
  </div>

  <div class="user-info">
    <span class="wave">👋</span>
    <span class="greeting">Hi,</span>
    <span class="user-name">{{ firstName }}</span>
  </div>

  <button
    class="theme-toggle"
    (click)="toggleTheme.emit()"
    aria-label="Toggle Theme"
  >
    ☀️
  </button>
</header>
