<div class="modal-backdrop" *ngIf="show">
  <div class="modal">
    <div class="modal-header">
      <span>{{ title }}</span>
      <button (click)="close()">×</button>
    </div>
    <div class="modal-content">
      <ng-content></ng-content>
    </div>
    <div class="modal-actions">
      <ng-content select=".modal-actions"></ng-content>
    </div>
  </div>
</div>
