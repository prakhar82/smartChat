<div class="modal-backdrop" *ngIf="show">
  <div class="modal-box">
    <header>
      <h3>{{ title }}</h3>
      <button class="close-btn" (click)="close()">✖</button>
    </header>

    <section class="modal-body">
      <ng-content></ng-content>
    </section>
  </div>
</div>
