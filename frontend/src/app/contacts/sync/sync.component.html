<div class="sync-container">
  <h2 class="title">Sync Your Contacts</h2>
  <p class="subtitle">
    Hi {{ firstName }}, choose how you want to sync your contacts:
  </p>

  <div class="btn-group">
    <!-- Phone Contacts -->
    <button
      class="btn phone-btn"
      (click)="syncDeviceContacts()"
      [disabled]="syncing"
    >
      📱 Sync Phone Contacts
    </button>

    <!-- Google Contacts -->
    <button
      class="btn google-btn"
      (click)="syncGoogleContacts()"
      [disabled]="syncing"
    >
      🔑 Sync Google Contacts
    </button>

    <!-- Skip -->
    <button class="btn skip-btn" (click)="skipSync()" [disabled]="syncing">
      ⏭️ Skip for Now
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="syncing" class="loading">
    ⏳ Syncing contacts... please wait
  </div>

  <!-- Error -->
  <div *ngIf="errorMsg" class="error">
    ❌ {{ errorMsg }}
  </div>

  <!-- Success -->
  <div *ngIf="!syncing && !errorMsg && userId" class="success">
    ✅ Contacts synced successfully!
  </div>
</div>
