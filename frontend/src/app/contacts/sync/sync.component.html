<div class="sync-container">
  <h2>👋 Hi {{ firstName || 'Friend' }},</h2>
  <p>Let’s sync your contacts so you can start chatting!</p>

  <button (click)="syncPhoneContacts()" [disabled]="syncing">📱 Sync Phone Contacts</button>
  <button (click)="syncGoogleContacts()" [disabled]="syncing">🔑 Sync Google Contacts</button>
  <button class="skip-btn" (click)="skipSync()">⏭ Skip</button>

  <p *ngIf="syncing">⏳ Syncing contacts...</p>
  <p class="error" *ngIf="errorMsg">{{ errorMsg }}</p>
</div>
