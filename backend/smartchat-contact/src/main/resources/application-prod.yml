############################################################
# ⚙️ SMARTCHAT CONTACT SERVICE — PRODUCTION CONFIG
# ----------------------------------------------------------
# Handles contact sync, Google imports, and caching.
# Backed by PostgreSQL, MongoDB, Redis, and RabbitMQ.
# ✅ Docker-ready | Eureka-integrated | Health-checked.
############################################################

spring:
  codec:
    max-in-memory-size: 10MB
  main:
    allow-bean-definition-overriding: true
  application:
    name: smartchat-contact

  ##########################################################
  # 🗄️ PostgreSQL — Main Contact Database
  ##########################################################
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB_CONTACT:smartchat_contact}
    username: ${POSTGRES_USER:smartchat}
    password: ${POSTGRES_PASSWORD:smartchat}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 60000
      connection-timeout: 30000
      pool-name: SmartChatContactHikariPool
  ##########################################################
  # 🧩 JPA / Hibernate Configuration
  ##########################################################
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


  ##########################################################
  # 🍃 MongoDB + Redis — Caching + Document Storage
  ##########################################################
  data:
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME:root}:${MONGO_INITDB_ROOT_PASSWORD:change_me}@${MONGO_HOST:mongo}:${MONGO_PORT:27017}/${MONGO_DB:smartchat}?authSource=admin
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      client-type: lettuce
      timeout: 60000
      connect-timeout: 2000

  ##########################################################
  # 🐇 RabbitMQ — Async Events & STOMP Relay
  ##########################################################
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:smartchat_user}
    password: ${RABBITMQ_PASS:smartchat123}
    virtual-host: ${RABBITMQ_VHOST:smartchat}
    connection-timeout: 15000
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 10000

  ##########################################################
  # 💬 STOMP Relay (for WebSocket Broker Communication)
  ##########################################################
messaging:
  stomp:
    relay:
      host: ${RABBITMQ_HOST:rabbitmq}
      port: ${STOMP_RELAY_PORT:61613}
      login: ${RABBITMQ_USER:smartchat_user}
      passcode: ${RABBITMQ_PASS:smartchat123}
      virtual-host: ${RABBITMQ_VHOST:smartchat}
      heartbeat-send-interval: 10000
      heartbeat-receive-interval: 10000

############################################################
# 🔐 Security / JWT Configuration
############################################################
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:3600000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    reset-token-expiration: ${RESET_TOKEN_EXPIRATION:900000}
    verification-token-expiration: ${VERIFICATION_TOKEN_EXPIRATION:86400000}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-duration: ${LOCKOUT_DURATION:900000}
    password:
      strength: ${PASSWORD_STRENGTH:12}



############################################################
# 🌍 Eureka Discovery Client
############################################################
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://smartchat-discovery:8761/eureka/}
  instance:
    hostname: smartchat-contact
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

############################################################
# 🤝 Feign Client + Resilience4J
############################################################
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: basic
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      contactServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        minimumNumberOfCalls: 5

############################################################
# 👥 Contact Sync + Google People API
############################################################
contacts:
  cache:
    ttl: ${CONTACTS_CACHE_TTL_SECONDS:300}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Default redirect - **ensure this exact value is registered in Google Console**
    redirect-uri: ${GOOGLE_REDIRECT_URI:https://app.smartchat.ai/api/contact/google/callback}

############################################################
# 🌐 Server Settings
############################################################
server:
  port: 8080
  forward-headers-strategy: native
  shutdown: graceful
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json
    min-response-size: 1024

############################################################
# 📊 Actuator / Metrics / Health
############################################################
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    probes:
      enabled: true
    postgres:
      enabled: true
    mongo:
      enabled: true
    redis:
      enabled: true
    rabbit:
      enabled: true

############################################################
# 🧾 Logging Configuration
############################################################
logging:
  file:
    name: ${LOG_DIR:/var/log/smartchat-contact}/app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.smartchat.contact: DEBUG
    org.springframework.cloud: INFO
    org.hibernate.SQL: WARN
    org.springframework.data.redis: WARN
    org.mongodb.driver: WARN
