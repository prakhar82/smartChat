############################################################
# 💬 SmartChat Chat Service - Development Configuration
############################################################

spring:
  application:
    name: smartchat-chat

  data:
    mongodb:
      uri: mongodb://${MONGO_INITDB_ROOT_USERNAME:root}:${MONGO_INITDB_ROOT_PASSWORD:change_me}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:smartchat}?authSource=admin
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      client-type: lettuce

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  codec:
    max-in-memory-size: 10MB

  server:
    port: ${CHAT_PORT:8082}
    shutdown: graceful
    servlet:
      context-path: /api

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: always


  main:
    allow-bean-definition-overriding: true

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: full
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      chatServiceCB:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        automaticTransitionFromOpenToHalfOpenEnabled: true
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5


server:
  port: ${CHAT_PORT:8082}
  shutdown: graceful

# 💡 Eureka Discovery for local microservice testing
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

chat:
  history-limit: ${CHAT_HISTORY_LIMIT:30}
  cache-ttl-minutes: ${CHAT_CACHE_TTL_MINUTES:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  file:
    name: ./logs/chat/app.log
  level:
    root: DEBUG
    com.smartchat.chat: DEBUG
