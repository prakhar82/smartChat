apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartchat-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smartchat-backend
  template:
    metadata:
      labels:
        app: smartchat-backend
    spec:
      containers:
        - name: backend
          image: your-docker-registry/smartchat-backend:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10   # give Spring Boot time to start
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
