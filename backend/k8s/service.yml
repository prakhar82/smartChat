apiVersion: v1
kind: Service
metadata:
  name: smartchat-backend
  labels:
    app: smartchat-backend
spec:
  selector:
    app: smartchat-backend   # must match labels in Deployment
  ports:
    - name: http
      port: 80               # service port (cluster-internal)
      targetPort: 8080       # containerPort from Deployment
  type: ClusterIP            # internal service (change to LoadBalancer for cloud-exposed)
