name: iOS CI
on: [push]
jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CocoaPods
        run: sudo gem install cocoapods
      - run: |
          cd frontend && npm ci && npm run build
          cd ../mobile && npm ci
          npx cap sync ios
          cd ios && pod install && xcodebuild -workspace App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath $PWD/build/App.xcarchive
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: mobile/ios/build/*.xcarchive
