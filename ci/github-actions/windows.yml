name: Windows CI
on: [push]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd frontend && npm ci && npm run build
          cd ../mobile && npm ci
          npm run electron:pack
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: mobile/dist/*.exe
